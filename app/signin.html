<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to SilentVoice AI</title>
<meta name="robots" content="noindex">
<style>
  /* Every colour here is copied from static/style.css, the stylesheet of the
     working interface, so that signing in looks like the beginning of the
     application rather than a separate page. */
  :root {
    --line: rgba(120,180,255,.18); --line2: rgba(22,213,255,.35);
    --text: #eef7ff; --muted: #9fb3cc; --soft: #cfe6ff;
    --cyan: #16d5ff; --red: #ff4f68;
    --field: rgba(8,20,42,.95);
    --shadow: 0 26px 70px rgba(0,0,0,.42);
    --glow: 0 0 36px rgba(22,213,255,.22);
    --focus: #16d5ff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 28px;
    color: var(--text);
    font-family: Inter, "Segoe UI", system-ui, Arial, sans-serif;
    font-size: 17px; line-height: 1.65;
    background:
      radial-gradient(circle at 18% -10%,rgba(22,213,255,.16),transparent 28%),
      radial-gradient(circle at 80% 0%,rgba(67,97,255,.12),transparent 34%),
      linear-gradient(180deg,#050b18 0%,#071225 48%,#09152c 100%);
    background-attachment: fixed;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
                      linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size: 46px 46px;
    mask-image: linear-gradient(to bottom,black,transparent 78%);
    -webkit-mask-image: linear-gradient(to bottom,black,transparent 78%);
  }
  .card {
    position: relative; overflow: hidden; z-index: 1;
    width: 100%; max-width: 470px;
    border: 1px solid var(--line); border-radius: 22px;
    background: linear-gradient(145deg,rgba(10,26,56,.86),rgba(6,16,34,.92));
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.06);
    padding: 40px 36px 34px;
    animation: rise .5s cubic-bezier(.22,.7,.3,1) both;
  }
  .card::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(circle at top left,rgba(22,213,255,.09),transparent 38%);
  }
  /* The cyan rule fills across the top, the same movement as the dwell
     indicator inside the interface. */
  .card::after {
    content: ""; position: absolute; left: 0; top: 0; height: 2px; width: 100%;
    background: linear-gradient(90deg,var(--cyan),rgba(24,119,255,.5),transparent);
    transform-origin: left center; transform: scaleX(0);
    animation: dwell 1.1s cubic-bezier(.22,.7,.3,1) .15s forwards;
  }
  .card > * { position: relative; z-index: 1; }
  .brand {
    display: flex; align-items: center; gap: 12px;
    font-size: 1.14rem; font-weight: 800; letter-spacing: -.01em; margin-bottom: 26px;
  }
  .brand img { height: 30px; width: auto; display: block; }
  .brand-ai { color: var(--cyan); text-shadow: 0 0 18px rgba(22,213,255,.5); }
  h1 { font-size: 1.45rem; font-weight: 800; margin: 0 0 10px; letter-spacing: -.025em; }
  p.lead { margin: 0 0 24px; color: var(--soft); font-size: .97rem; }
  label { display: block; font-weight: 700; margin: 0 0 8px; font-size: .93rem; }
  input {
    width: 100%; min-height: 52px; padding: 0 15px; margin-bottom: 18px;
    font: inherit; color: var(--text);
    background: var(--field);
    border: 1px solid var(--line); border-radius: 12px;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  input:focus { border-color: var(--line2); box-shadow: 0 0 20px rgba(22,213,255,.12); }
  input:focus-visible, button:focus-visible, a:focus-visible {
    outline: 3px solid var(--focus); outline-offset: 2px;
  }
  button {
    width: 100%; min-height: 52px; margin-top: 4px;
    border: 0; border-radius: 14px; cursor: pointer;
    font: inherit; font-weight: 700; color: #fff;
    background: linear-gradient(135deg,#165eff,#10cfff);
    box-shadow: 0 0 28px rgba(22,213,255,.18);
    transition: transform .2s ease, box-shadow .2s ease;
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 0 40px rgba(22,213,255,.30); }
  button[disabled], input[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
  button[disabled]:hover { transform: none; box-shadow: 0 0 28px rgba(22,213,255,.18); }
  .error {
    border: 1px solid rgba(255,79,104,.45); border-left: 3px solid var(--red);
    background: linear-gradient(135deg,rgba(127,29,29,.42),rgba(69,10,10,.3));
    color: #ffc9d1;
    border-radius: 6px 14px 14px 6px;
    padding: 14px 17px; margin: 0 0 22px;
    font-size: .94rem; line-height: 1.6;
  }
  .note { margin: 24px 0 0; color: var(--muted); font-size: .88rem; line-height: 1.6; }
  a { color: var(--cyan); }
  @keyframes dwell { to { transform: scaleX(1); } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .card::after { transform: scaleX(1); }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="/static/logo-light.png" alt="">
      SilentVoice <span class="brand-ai">AI</span>
    </div>

    <h1>Sign in</h1>
    <p class="lead">The working prototype is not public while the product is under regulatory
    assessment. Use the invitation code and password you were given.</p>

    <!--MESSAGE-->

    <form method="post" action="/sign-in">
      <label for="code">Invitation code</label>
      <input id="code" name="code" type="text" autocomplete="off" autocapitalize="off"
             spellcheck="false" required autofocus>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>

      <button type="submit">Sign in</button>
    </form>

    <p class="note">If you do not have a code, there is nothing to sign in to yet.
    <a href="/">Back to the public page</a>.</p>
  </main>
</body>
</html>
