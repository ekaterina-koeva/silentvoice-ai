<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in to SilentVoice AI</title>
<meta name="robots" content="noindex">
<style>
  /* The background is the background of the working interface, copied from
     static/style.css, so signing in is the beginning of the application and not
     a separate place. The card on top of it is light on purpose. A dark card on
     a dark background leaves the fields barely visible, which is the opposite
     of what a form asking for two things it will not explain should do. */
  :root {
    --cyan: #16d5ff;
    --ink: #0c1a30;
    --ink-soft: #4a5b72;
    --line: #dde4ee;
    --line-strong: #b9c6d8;
    --card: #ffffff;
    --field: #f7f9fc;
    --error-bg: #fdf1f0;
    --error-line: #e7cdc9;
    --error-rule: #c0392b;
    --error-ink: #7d2b20;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    padding: 28px;
    font-family: Inter, "Segoe UI", system-ui, Arial, sans-serif;
    font-size: 17px; line-height: 1.62; color: var(--ink);
    background:
      radial-gradient(circle at 18% -10%,rgba(22,213,255,.16),transparent 28%),
      radial-gradient(circle at 80% 0%,rgba(67,97,255,.12),transparent 34%),
      linear-gradient(180deg,#050b18 0%,#071225 48%,#09152c 100%);
    background-attachment: fixed;
  }
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background-image: linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),
                      linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);
    background-size: 46px 46px;
    mask-image: linear-gradient(to bottom,black,transparent 78%);
    -webkit-mask-image: linear-gradient(to bottom,black,transparent 78%);
  }
  .card {
    position: relative; overflow: hidden; z-index: 1;
    width: 100%; max-width: 460px;
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.08);
    padding: 38px 36px 32px;
    animation: rise .5s cubic-bezier(.22,.7,.3,1) both;
  }
  /* The cyan rule fills across the top, the same movement as the dwell
     indicator inside the interface. */
  .card::after {
    content: ""; position: absolute; left: 0; top: 0; height: 3px; width: 100%;
    background: linear-gradient(90deg,#165eff,var(--cyan),transparent);
    transform-origin: left center; transform: scaleX(0);
    animation: dwell 1.1s cubic-bezier(.22,.7,.3,1) .15s forwards;
  }
  .brand {
    display: flex; align-items: center; gap: 11px;
    font-size: 1.1rem; font-weight: 800; letter-spacing: -.01em; margin-bottom: 24px;
  }
  .brand img { height: 28px; width: auto; display: block; }
  .brand-ai { color: #0e94b8; }
  h1 { font-size: 1.42rem; font-weight: 800; margin: 0 0 8px; letter-spacing: -.025em; }
  p.lead { margin: 0 0 22px; color: var(--ink-soft); font-size: .95rem; }
  label { display: block; font-weight: 700; margin: 0 0 6px; font-size: .9rem; }
  input {
    width: 100%; min-height: 52px; padding: 0 15px; margin-bottom: 16px;
    font: inherit; font-size: 1rem; color: var(--ink);
    background: var(--field);
    border: 1px solid var(--line-strong); border-radius: 11px;
    transition: border-color .16s ease, box-shadow .16s ease, background .16s ease;
  }
  input::placeholder { color: #93a2b6; opacity: 1; }
  input:hover:not([disabled]) { border-color: #8ea2bd; }
  input:focus {
    background: #ffffff; border-color: #0e94b8;
    box-shadow: 0 0 0 4px rgba(22,213,255,.18);
  }
  input[disabled] {
    background: #f2f4f8; border-style: dashed; border-color: var(--line);
    color: #93a2b6; cursor: not-allowed;
  }
  input:focus-visible, button:focus-visible, a:focus-visible {
    outline: 3px solid #0e94b8; outline-offset: 2px;
  }
  button {
    width: 100%; min-height: 52px; margin-top: 6px;
    border: 0; border-radius: 12px; cursor: pointer;
    font: inherit; font-weight: 700; font-size: 1rem; color: #fff;
    background: linear-gradient(135deg,#165eff,#10cfff);
    box-shadow: 0 8px 22px rgba(16,110,255,.3);
    transition: transform .18s ease, box-shadow .18s ease;
  }
  button:hover:not([disabled]) { transform: translateY(-1px); box-shadow: 0 12px 28px rgba(16,110,255,.38); }
  button[disabled] { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
  .error {
    border: 1px solid var(--error-line); border-left: 3px solid var(--error-rule);
    background: var(--error-bg); color: var(--error-ink);
    border-radius: 5px 12px 12px 5px;
    padding: 13px 16px; margin: 0 0 20px;
    font-size: .92rem; line-height: 1.55;
  }
  .note { margin: 20px 0 0; color: var(--ink-soft); font-size: .85rem; line-height: 1.55; }
  a { color: #0e94b8; }
  @keyframes dwell { to { transform: scaleX(1); } }
  @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
    .card::after { transform: scaleX(1); }
  }
</style>
</head>
<body>
  <main class="card">
    <div class="brand">
      <img src="/static/logo-dark.png" alt="">
      SilentVoice <span class="brand-ai">AI</span>
    </div>

    <h1>Sign in</h1>
    <p class="lead">The working prototype is not public while the product is under regulatory
    assessment. Use the invitation code and password you were given.</p>

    <!--MESSAGE-->

    <form method="post" action="/sign-in">
      <label for="code">Invitation code</label>
      <input id="code" name="code" type="text" autocomplete="off" autocapitalize="off"
             spellcheck="false" placeholder="SV-XXXX-XXXX-XXXX" required autofocus>

      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
             placeholder="The password you were given" required>

      <button type="submit">Sign in</button>
    </form>

    <p class="note">If you do not have a code, there is nothing to sign in to yet.
    <a href="/">Back to the public page</a>.</p>
  </main>
</body>
</html>
